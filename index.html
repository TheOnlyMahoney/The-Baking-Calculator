<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Baking Notes - Bread Calculator</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#5c321e">
  <style>
    :root {
      --bg-color: #faf7f2;
      --card-bg: #ffffff;
      --primary: #5c321e;
      --primary-accent: #8c4a27;
      --text: #2e2a27;
      --muted: #7a6e65;
      --border: #e3d9cd;
      --danger: #b33a3a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 760px; }
    header { text-align: center; margin-bottom: 12px; }
    header h1 { font-family: Georgia, serif; color: var(--primary); margin: 0 0 4px 0; font-size: 22px; }
    header p { color: var(--muted); font-size: 13px; margin: 0; }
    .control-card, .section-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .grid-2 { display: grid; grid-template-columns: 1fr 360px; gap: 12px; align-items:start; }
    .input-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--primary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .row { display: flex; gap: 12px; }
    .col { flex: 1; }
    input[type="number"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; background: #fdfbf7; color: var(--text); outline: none; }
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; margin-left: 8px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary-accent); } input:checked + .slider:before { transform: translateX(20px); }
    .total-badge { background: #f0e8dd; color: var(--primary); text-align: center; padding: 10px; border-radius: 8px; font-weight: 700; margin-bottom: 14px; font-size: 14px; border: 1px solid var(--border); }
    .section-title { font-weight: 700; color: var(--primary-accent); font-size: 12px; text-transform: uppercase; margin-bottom: 8px; display:flex; justify-content:space-between; }
    .ingredient-list { list-style: none; padding: 0; margin: 0; font-size: 14px; }
    .ingredient-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #f0e8dd; }
    .ingredient-list li:last-child { border-bottom: none; }
    .weight { font-weight: 700; color: var(--primary); }
    .muted { color: var(--muted); font-size: 12px; }
    .warning { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .status { font-size: 13px; margin-bottom: 8px; }
    .btn { display:inline-block;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--primary);font-weight:700;text-decoration:none;margin-right:8px }
    .btn-danger { color:#fff;background:var(--danger);border-color:var(--danger) }
    pre { background:#fff;padding:8px;border-radius:6px;border:1px solid #eee;max-height:160px;overflow:auto;font-size:13px }
    @media (max-width:880px){ .grid-2{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🥖 Baking Notes</h1>
      <p>Hybrid Italian White Bread Calculator</p>
    </header>

    <div class="grid-2">
      <!-- Left: Controls & Calculator -->
      <div>
        <div class="control-card" aria-labelledby="controlsTitle">
          <div id="controlsTitle" style="display:none">Controls</div>

          <div class="row input-group">
            <div class="col">
              <label for="numLoaves">Loaves</label>
              <input type="number" id="numLoaves" value="2" min="1" max="20" step="1" inputmode="numeric" aria-label="Number of loaves">
            </div>
            <div class="col">
              <label for="weightPerLoaf">Weight / Loaf (g)</label>
              <input type="number" id="weightPerLoaf" value="930" min="100" max="2000" step="10" inputmode="numeric" aria-label="Weight per loaf in grams">
            </div>
          </div>

          <div class="input-group" style="margin-top:6px">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div>
                <div style="display:flex;align-items:center;justify-content:space-between">
                  <label for="usePoolish" style="margin:0">Use Poolish</label>
                  <label class="switch"><input type="checkbox" id="usePoolish" checked><span class="slider"></span></label>
                </div>
                <div style="display:flex;gap:8px;margin-top:8px">
                  <input type="number" id="poolishPct" value="10" min="0" max="100" step="1" style="width:80px" /> <div class="muted" style="align-self:center">Poolish % of total flour</div>
                </div>
              </div>

              <div>
                <div style="display:flex;align-items:center;justify-content:space-between">
                  <label for="useBiga" style="margin:0">Use Biga</label>
                  <label class="switch"><input type="checkbox" id="useBiga"><span class="slider"></span></label>
                </div>
                <div style="display:flex;gap:8px;margin-top:8px">
                  <input type="number" id="bigaPct" value="0" min="0" max="100" step="1" style="width:80px" /> <div class="muted" style="align-self:center">Biga % of total flour</div>
                </div>
                <div style="display:flex;gap:8px;margin-top:8px">
                  <input type="number" id="bigaHydration" value="60" min="0" max="200" step="1" style="width:80px" /> <div class="muted" style="align-self:center">Biga hydration %</div>
                </div>
              </div>
            </div>

            <div id="prefWarning" class="warning" role="alert" aria-live="polite" style="display:none"></div>
          </div>

          <div class="input-group" style="margin-top: 6px;">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label for="useTangzhong" style="margin:0;">Include Tangzhong (Milk Roux)</label>
              <label class="switch"><input type="checkbox" id="useTangzhong" checked><span class="slider"></span></label>
            </div>
          </div>

          <!-- Cold proof control -->
          <div style="margin-top:12px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <label for="useColdProof" style="margin:0">Cold proof (retard) in fridge?</label>
              <label class="switch"><input type="checkbox" id="useColdProof"><span class="slider"></span></label>
            </div>
            <div style="display:flex;gap:8px;margin-top:8px">
              <input type="number" id="coldHours" value="12" min="4" max="168" step="1" style="width:80px" />
              <div
